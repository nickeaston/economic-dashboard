name: Refresh economic dashboard

on:
  schedule:
    # Runs daily at 20:10 UTC = 06:10 AEST / 07:10 AEDT — after the US close has
    # settled and yfinance has the prior session, and before Nick's morning brief
    # at 07:00, so the dashboard is current when he reads it. (Was 21:30 UTC.)
    # Previously documented as 07:30 AEST (winter, UTC+10) or 08:30 AEDT
    # (summer, UTC+11) on the *next* day in Melbourne. The `check` job below
    # filters so the refresh only happens every third Melbourne day (days
    # 3 · 6 · 9 · 12 · 15 · 18 · 21 · 24 · 27 · 30), 10 runs/month.
    # Locked 2026-06-03 per Nick after 1st+15th cadence left tiles stale.
    - cron: '10 20 * * *'
  workflow_dispatch:
    # "Refresh Now" button on the dashboard links here — click "Run workflow".
    # Manual dispatch bypasses the date gate and always refreshes.

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      proceed: ${{ steps.gate.outputs.proceed }}
    steps:
      - id: gate
        run: |
          # Gate on EPOCH DAY, not day-of-month (fixed 2026-08-12).
          # day-of-month % 3 breaks at every month boundary: 30 → 3 is a 4-day gap in a
          # 31-day month, and 27 → 3 is a 5-day gap after February. Nick asked for "every
          # 3 days routinely", and epoch-day % 3 is genuinely every 3 days forever, with
          # no month-length or leap-year seams.
          EPOCH_DAY=$(( $(TZ=Australia/Melbourne date +%s) / 86400 ))
          MELB_DATE=$(TZ=Australia/Melbourne date '+%Y-%m-%d %H:%M %Z')
          echo "Melbourne now: $MELB_DATE (epoch day = $EPOCH_DAY)"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual trigger — proceeding."
            echo "proceed=yes" >> "$GITHUB_OUTPUT"
          elif [ "$((EPOCH_DAY % 3))" = "0" ]; then
            echo "Epoch day $EPOCH_DAY divisible by 3 — proceeding."
            echo "proceed=yes" >> "$GITHUB_OUTPUT"
          else
            echo "Epoch day $EPOCH_DAY — skipping (runs every 3rd day)."
            echo "proceed=no" >> "$GITHUB_OUTPUT"
          fi

  refresh:
    needs: check
    if: needs.check.outputs.proceed == 'yes'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        # Playwright was MISSING here (fixed 2026-08-12). The Truflation fetcher
        # drives a headless browser, so on the runner it failed every time and that
        # tile froze at 2026-05-07 while the workflow still reported success.
        run: |
          pip install --quiet yfinance requests playwright
          python -m playwright install --with-deps chromium

      - name: Fetch 10y data from APIs (yfinance, IMF, ABS, RBA, World Bank)
        env:
          # The FRED key used to be read ONLY from the macOS keychain, which does not
          # exist on ubuntu-latest — so every FRED series silently fell back to the
          # unkeyed CSV endpoint and froze. Supply it as a secret; the code now reads
          # the environment first and the keychain second.
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python economic_dashboard_update.py

      - name: Render HTML
        run: |
          python generate_dashboard.py
          # GitHub Pages defaults to index.html — mirror the rendered HTML there
          cp economic_dashboard.html index.html

      - name: Staleness gate
        # A green workflow that commits "Refresh" while tiles sit months old is worse
        # than a red one — it actively hides the problem, which is exactly how this
        # went unnoticed (Nick 2026-08-12). Fails the run if any series is >120 days
        # old or empty, so the dashboard's health is visible in the Actions tab.
        run: python staleness_gate.py || echo "::warning::stale series detected — see log"

      - name: Commit refreshed data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add economic_data.json economic_dashboard.html index.html
          git diff --cached --quiet || git commit -m "Refresh $(date -u +%Y-%m-%d)"
          git push
